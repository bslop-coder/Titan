name: Build Titan Vulkan APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Titan Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fetch stable-diffusion.cpp submodule
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp app/src/main/cpp/sdcpp

      - name: Compile Titan APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Titan APK
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Vulkan-Release
          path: app/build/outputs/apk/release/*.apk
