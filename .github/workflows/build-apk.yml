name: Build Titan Vulkan APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Titan Source
        uses: actions/checkout@v4

      - name: Install Vulkan Tools and Khronos Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers ninja-build
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_INSTALL_PREFIX=/tmp/spirv-headers/install
          cmake --install /tmp/spirv-headers/build
          cp -r /tmp/spirv-headers/include/* /tmp/vulkan-headers/include/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fetch stable-diffusion.cpp submodule
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp app/src/main/cpp/sdcpp

      - name: Compile Titan APK
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ Build Error & Compiler Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            if grep -q "FAILED:" build.log; then
              grep -B 2 -A 30 "FAILED:" build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            elif grep -q "error:" build.log; then
              grep -B 2 -A 30 "error:" build.log | head -n 35 >> $GITHUB_STEP_SUMMARY
            else
              tail -n 35 build.log >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload Titan APK
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Vulkan-Release
          path: app/build/outputs/apk/release/*.apk
